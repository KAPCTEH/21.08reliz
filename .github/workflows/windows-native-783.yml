name: Windows native release gate

on:
  workflow_dispatch:
  push:
    branches: [main, "agent/**"]
  pull_request:

permissions:
  contents: read
  attestations: write
  id-token: write

jobs:
  build-and-accept:
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      ELECTRON_CACHE: ${{ github.workspace }}\.cache\electron
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}\.cache\electron-builder

    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Configure Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            source/application/package-lock.json
            source/desktop-runtime/package-lock.json
            source/installer/package-lock.json
            tests/package-lock.json

      - name: Resolve and verify canonical release contract
        shell: pwsh
        run: |
          $release = Get-Content -LiteralPath 'source/application/release.json' -Raw | ConvertFrom-Json
          $version = [string]$release.version
          if ($version -notmatch '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?$') {
            throw "Invalid product version in release.json: $version"
          }
          "JF_PRODUCT_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          New-Item -ItemType Directory -Path '.release' -Force | Out-Null
          node tools/release/verify-release-contract.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Canonical release contract validation failed.' }
          node tools/release/write-build-identity.mjs --output .release/build-identity.json --commit $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw 'Exact build identity generation failed.' }
          git archive --format=zip --output=.release/source.zip $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw 'Exact source archive generation failed.' }

      - name: Configure Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install pinned Python build dependency
        shell: pwsh
        run: python -m pip install --disable-pip-version-check --no-deps Pillow==12.3.0

      - name: Configure .NET 8
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: "8.0.423"

      - name: Build and self-test Update Helper
        shell: pwsh
        run: |
          $fileVersion = "$($env:JF_PRODUCT_VERSION).0"
          dotnet restore source/update-helper/JustFunUpdateHelper.csproj --locked-mode `
            /p:JustFunProductVersion=$env:JF_PRODUCT_VERSION `
            /p:JustFunProductFileVersion=$fileVersion
          if ($LASTEXITCODE -ne 0) { throw 'Update Helper locked restore failed.' }
          dotnet publish source/update-helper/JustFunUpdateHelper.csproj `
            -c Release -r win-x64 --self-contained true --no-restore `
            -o .release/update-helper `
            /p:JustFunProductVersion=$env:JF_PRODUCT_VERSION `
            /p:JustFunProductFileVersion=$fileVersion
          if ($LASTEXITCODE -ne 0) { throw 'Update Helper publish failed.' }
          $helper = Join-Path $PWD '.release\update-helper\JustFunUpdateHelper.exe'
          $report = Join-Path $PWD '.release\update-helper-self-test.json'
          $process = Start-Process -FilePath $helper -ArgumentList "--self-test-report=$report" -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Update Helper self-test returned $($process.ExitCode)." }
          $result = Get-Content -LiteralPath $report -Raw | ConvertFrom-Json
          if ($result.ok -ne $true -or [int]$result.checks -lt 10) { throw 'Update Helper self-test evidence is incomplete.' }

      - name: Install pinned Node dependencies
        shell: pwsh
        run: |
          foreach ($directory in @('source/application','source/desktop-runtime','source/installer','tests')) {
            Push-Location $directory
            npm ci
            if ($LASTEXITCODE -ne 0) { throw "npm ci failed in $directory" }
            Pop-Location
          }

      - name: Download and verify NSIS 3.11
        shell: pwsh
        run: |
          $url = 'https://github.com/tauri-apps/binary-releases/releases/download/nsis-3.11/nsis-3.11.zip'
          $expected = 'c7d27f780ddb6cffb4730138cd1591e841f4b7edb155856901cdf5f214394fa1'
          $zip = Join-Path $env:RUNNER_TEMP 'nsis-3.11.zip'
          $directory = Join-Path $env:RUNNER_TEMP 'nsis-3.11'
          Invoke-WebRequest -Uri $url -OutFile $zip
          $actual = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "NSIS archive hash mismatch: $actual" }
          Expand-Archive -LiteralPath $zip -DestinationPath $directory -Force
          $makensis = (Get-ChildItem -LiteralPath $directory -Filter makensis.exe -Recurse -File | Select-Object -First 1).FullName
          if (-not $makensis) { throw 'makensis.exe is missing from the verified NSIS archive.' }
          "NSIS_MAKENSIS=$makensis" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Run source, security and release contracts
        shell: pwsh
        run: |
          node tests/security-audit.mjs source tools .github
          if ($LASTEXITCODE -ne 0) { throw 'Security audit failed.' }
          node tests/source-hygiene-regression-v783.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Source hygiene regression failed.' }
          node tests/static-audit-regression-v783.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Static audit regression failed.' }
          node tests/main-unit.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Main unit tests failed.' }
          node tests/tz3-live-defects-unit.cjs
          if ($LASTEXITCODE -ne 0) { throw 'TZ3 live-defect regressions failed.' }
          node tests/license-server-unit.mjs
          if ($LASTEXITCODE -ne 0) { throw 'License server unit tests failed.' }
          python tests/license-schema-test.py
          if ($LASTEXITCODE -ne 0) { throw 'License schema and migration tests failed.' }
          node tests/auth-reg-source-contract.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Authorization source contract failed.' }
          node tests/update-core-unit.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Update core unit tests failed.' }
          node tests/update-downloader-unit.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Update downloader unit tests failed.' }
          node tests/update-controller-unit.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Update controller unit tests failed.' }
          node tests/update-ui-unit.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Update UI unit tests failed.' }
          node tests/update-helper-runner-unit.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Update Helper runner unit tests failed.' }
          python tests/release-evidence-unit.py
          if ($LASTEXITCODE -ne 0) { throw 'Release evidence unit tests failed.' }
          node tests/reg-entity-source-contract.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Entity source contract failed.' }
          python tests/reg-legacy-migration-unit.py
          if ($LASTEXITCODE -ne 0) { throw 'Legacy storage migration unit tests failed.' }
          python tests/reg-legacy-migration-integration.py
          if ($LASTEXITCODE -ne 0) { throw 'Legacy storage migration integration tests failed.' }
          node tests/entity-bootstrap-merge-unit.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Entity bootstrap merge unit test failed.' }
          python tests/reg-revision-test.py
          if ($LASTEXITCODE -ne 0) { throw 'Storage v3 revision tests failed.' }
          node tests/background-cloud-sync-failure-regression-v783.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Background VPS sync failure regression failed.' }
          node tests/current-cycle-regression-v783.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Current-cycle regression failed.' }
          node tests/address-intelligence-unit-v783.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Address intelligence regression failed.' }
          python tests/reg-address-search-test.py
          if ($LASTEXITCODE -ne 0) { throw 'REG address search contract failed.' }
          node tests/design-token-regression-v783.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Design-token regression failed.' }
          node tests/product-drawer-accessibility-v783.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Product drawer accessibility regression failed.' }
          $env:JF_TEST_EDITION = 'demo'
          node tests/runtime-smoke.mjs source/application/web accessibility
          if ($LASTEXITCODE -ne 0) { throw 'Training accessibility regression failed.' }
          $env:JF_TEST_EDITION = 'full'
          node tests/runtime-smoke.mjs source/application/web order-print
          if ($LASTEXITCODE -ne 0) { throw 'Order print regression failed.' }
          node tests/runtime-smoke.mjs source/application/web order-save-integrity
          if ($LASTEXITCODE -ne 0) { throw 'Order save integrity regression failed.' }
          node tests/runtime-smoke.mjs source/application/web atomic-mutation
          if ($LASTEXITCODE -ne 0) { throw 'Atomic VPS mutation regression failed.' }
          node tests/runtime-smoke.mjs source/application/web local-to-server-migration
          if ($LASTEXITCODE -ne 0) { throw 'Local-to-server migration regression failed.' }
          node tests/runtime-smoke.mjs source/application/web local-to-server-migration-resume
          if ($LASTEXITCODE -ne 0) { throw 'Local-to-server migration resume regression failed.' }
          node tests/runtime-smoke.mjs source/application/web deep-business
          if ($LASTEXITCODE -ne 0) { throw 'Deep business regression failed.' }
          node tests/experience-regression-v783.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Experience regression failed.' }
          node tests/visual-qa-contract-regression-v783.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Visual QA contracts failed.' }
          node tests/release-regression-v783.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Release regression failed.' }
          python tests/installer-source-test.py
          if ($LASTEXITCODE -ne 0) { throw 'Installer source tests failed.' }
          [ordered]@{
            schema_version = 1
            commit_sha = $env:GITHUB_SHA.ToLowerInvariant()
            groups = @(
              [ordered]@{ id = 'source-contracts'; status = 'passed' },
              [ordered]@{ id = 'security'; status = 'passed' },
              [ordered]@{ id = 'business-regression'; status = 'passed' },
              [ordered]@{ id = 'installer-source'; status = 'passed' },
              [ordered]@{ id = 'updater-core'; status = 'passed' }
            )
          } | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath '.release/prebuild-test-results.json' -Encoding utf8

      - name: Build protected Electron payload
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path .release -Force | Out-Null
          python source/desktop-runtime/build_payload.py `
            --app-dir source/application `
            --electron-dist source/desktop-runtime/node_modules/electron/dist `
            --update-helper .release/update-helper/JustFunUpdateHelper.exe `
            --output-dir .release/payload
          if ($LASTEXITCODE -ne 0) { throw 'Payload build failed.' }
          node tests/update-payload-identity-test.mjs .release/payload
          if ($LASTEXITCODE -ne 0) { throw 'Protected Update Helper payload identity failed.' }

      - name: Build native Recovery, update payload and premium Setup
        shell: pwsh
        run: |
          python source/installer/build_windows.py `
            --payload-dir .release/payload `
            --logo source/application/assets/JustFun-official.png `
            --output-dir .release/installer `
            --node-modules source/desktop-runtime/node_modules `
            --build-identity .release/build-identity.json `
            --source-archive .release/source.zip `
            --test-evidence .release/prebuild-test-results.json `
            --makensis $env:NSIS_MAKENSIS
          if ($LASTEXITCODE -ne 0) { throw 'Native Windows installer build failed.' }
          node tools/release/verify-build-manifest.mjs `
            --manifest .release/installer/BUILD-MANIFEST.json `
            --build-identity .release/build-identity.json `
            --source-archive .release/source.zip `
            --payload-dir .release/payload `
            --installer-dir .release/installer
          if ($LASTEXITCODE -ne 0) { throw 'Extended BUILD-MANIFEST verification failed.' }

      - name: Render and validate every premium installer screen
        shell: pwsh
        run: |
          $preview = Join-Path $PWD '.release\premium-previews'
          $setup = Join-Path $PWD ".release\installer\Orders-Logistics-Setup-$env:JF_PRODUCT_VERSION-Premium.exe"
          New-Item -ItemType Directory -Path $preview -Force | Out-Null
          $process = Start-Process -FilePath $setup -ArgumentList "--render-previews=$preview" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Premium preview renderer returned $($process.ExitCode)." }
          foreach ($name in @('01-welcome.png','02-options.png','03-progress.png','04-finish.png','05-error.png')) {
            $path = Join-Path $preview $name
            if (-not (Test-Path -LiteralPath $path -PathType Leaf) -or (Get-Item -LiteralPath $path).Length -lt 10000) {
              throw "Premium installer preview is missing or empty: $name"
            }
          }
          python source/installer/build_assets.py --logo source/application/assets/JustFun-official.png --output-dir .release/assets
          if ($LASTEXITCODE -ne 0) { throw 'Installer asset build failed.' }

      - name: Run hidden application visual acceptance
        shell: pwsh
        run: |
          $qa = Join-Path $PWD '.release\visual-qa'
          New-Item -ItemType Directory -Path $qa -Force | Out-Null
          $app = Join-Path $PWD '.release\payload\OrdersLogistics.exe'
          $process = Start-Process -FilePath $app -ArgumentList "--visual-qa-output=$qa" -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            $resultPath = Join-Path $qa 'VISUAL-QA.json'
            if (Test-Path -LiteralPath $resultPath -PathType Leaf) { Get-Content -LiteralPath $resultPath -Raw }
            throw "Visual QA returned $($process.ExitCode)."
          }
          foreach ($name in @('07-route-telegram-actions.png','08-driver-telegram.png','VISUAL-QA.json')) {
            if (-not (Test-Path -LiteralPath (Join-Path $qa $name) -PathType Leaf)) {
              throw "Visual QA artifact is missing: $name"
            }
          }
          $result = Get-Content -LiteralPath (Join-Path $qa 'VISUAL-QA.json') -Raw | ConvertFrom-Json
          if (@($result.errors).Count -ne 0) { throw "Visual QA errors: $($result.errors -join '; ')" }

      - name: Exercise interrupted update recovery
        shell: pwsh
        run: |
          & tests/installer-crash-recovery-test.ps1 -Makensis $env:NSIS_MAKENSIS -AssetsDir (Join-Path $PWD '.release\assets')
          if (-not $?) { throw 'Installer crash recovery test failed.' }

      - name: Run isolated full installer acceptance
        shell: pwsh
        run: |
          $setup = Join-Path $PWD ".release\installer\Orders-Logistics-Setup-$env:JF_PRODUCT_VERSION-Premium.exe"
          & tests/installer-full-acceptance-test.ps1 -Setup $setup -EvidenceDirectory (Join-Path $PWD '.release\full-acceptance')
          if (-not $?) { throw 'Full installer acceptance failed.' }

      - name: Verify shortcut, icon and destructive-operation refusals
        shell: pwsh
        run: |
          function Invoke-Native([string]$File, [string[]]$Arguments) {
            $start = [Diagnostics.ProcessStartInfo]::new()
            $start.FileName = $File
            $start.UseShellExecute = $false
            $start.CreateNoWindow = $true
            foreach ($argument in $Arguments) { $start.ArgumentList.Add($argument) }
            $process = [Diagnostics.Process]::Start($start)
            if (-not $process) { throw "Could not start $File" }
            $process.WaitForExit()
            return $process.ExitCode
          }
          $root = Join-Path $env:RUNNER_TEMP ('jf-native-' + [Guid]::NewGuid().ToString('N'))
          $install = Join-Path $root 'Program'
          $data = Join-Path $root 'Data'
          $evidence = Join-Path $PWD '.release\native-safety'
          $setup = Join-Path $PWD ".release\installer\Orders-Logistics-Setup-$env:JF_PRODUCT_VERSION-Premium.exe"
          $desktop = [Environment]::GetFolderPath([Environment+SpecialFolder]::DesktopDirectory)
          $shortcutPath = Join-Path $desktop 'JustFun Логистика.lnk'
          New-Item -ItemType Directory -Path $root, $evidence -Force | Out-Null
          $app = $null
          try {
            $installArgs = @('/S', "/DATADIR=$data", '/MODE=demo', '/NOSTART', "/D=$install")
            $installExit = Invoke-Native $setup $installArgs
            if ($installExit -ne 0) { throw "Shortcut acceptance install returned $installExit." }

            $exe = Join-Path $install 'OrdersLogistics.exe'
            $uninstaller = Join-Path $install 'Orders-Logistics-Uninstall.exe'
            if (-not (Test-Path -LiteralPath $shortcutPath -PathType Leaf)) { throw 'Desktop shortcut is missing.' }
            $shell = New-Object -ComObject Shell.Application
            $folder = $shell.Namespace($desktop)
            $item = $folder.ParseName('JustFun Логистика.lnk')
            $link = $item.GetLink
            if ([IO.Path]::GetFullPath($link.Path) -ne [IO.Path]::GetFullPath($exe)) { throw 'Desktop shortcut target is invalid' }
            $iconSource = ''
            $iconIndex = $link.GetIconLocation([ref]$iconSource)
            if ([IO.Path]::GetFullPath($iconSource) -ne [IO.Path]::GetFullPath($exe)) { throw 'Desktop shortcut icon source is invalid' }
            if ($iconIndex -ne 0) { throw "Desktop shortcut icon index is invalid: $iconIndex" }
            node tests/verify-pe-icon.mjs $exe (Join-Path $PWD '.release\assets\JustFun.ico')
            if ($LASTEXITCODE -ne 0) { throw 'Installed executable icon differs from the official icon' }

            $app = Start-Process -FilePath $exe -PassThru
            $deadline = (Get-Date).AddSeconds(45)
            do {
              Start-Sleep -Milliseconds 250
              $app.Refresh()
            } while (-not $app.HasExited -and $app.MainWindowHandle -eq 0 -and (Get-Date) -lt $deadline)
            if ($app.HasExited -or $app.MainWindowHandle -eq 0) { throw 'Installed application did not open a main window.' }

            $lockedLog = Join-Path $evidence 'uninstall-locked.log'
            Remove-Item -LiteralPath $lockedLog -Force -ErrorAction SilentlyContinue
            $lockedLaunchExit = Invoke-Native $uninstaller @('/S', "/LOG=$lockedLog")
            if ($lockedLaunchExit -notin @(0, 30)) { throw "Running-application uninstaller launcher returned unexpected code $lockedLaunchExit." }
            $deadline = (Get-Date).AddSeconds(30)
            $lockedResult = ''
            do {
              if (Test-Path -LiteralPath $lockedLog -PathType Leaf) {
                $lockedResult = Get-Content -LiteralPath $lockedLog -Raw
              }
              if (-not $lockedResult.Contains('FAIL application is running')) { Start-Sleep -Milliseconds 250 }
            } while (-not $lockedResult.Contains('FAIL application is running') -and (Get-Date) -lt $deadline)
            if (Test-Path -LiteralPath $lockedLog -PathType Leaf) {
              Write-Output "Running-application uninstall log:`n$lockedResult"
            }
            if (-not $lockedResult.Contains('FAIL application is running')) {
              throw "Running-application uninstall refusal was not recorded (launcher exit $lockedLaunchExit)."
            }
            if (-not (Test-Path -LiteralPath $exe -PathType Leaf) -or -not (Test-Path -LiteralPath $data -PathType Container)) {
              throw 'Running-application uninstall changed protected state.'
            }
            Write-Output 'Running-application uninstall refusal and state preservation: PASS'

            Stop-Process -Id $app.Id -Force
            $app.WaitForExit()
            $app = $null
            'tampered-marker' | Set-Content -LiteralPath (Join-Path $data '.justfun\product-root.txt') -Encoding ascii
            $invalidLog = Join-Path $evidence 'uninstall-invalid-marker.log'
            $invalidExit = Invoke-Native $uninstaller @('/S', '/PURGEDATA', "/LOG=$invalidLog")
            if ($invalidExit -ne 0) { throw "Invalid-marker uninstall returned $invalidExit." }
            $deadline = (Get-Date).AddSeconds(120)
            while ((Test-Path -LiteralPath $exe) -and (Get-Date) -lt $deadline) { Start-Sleep -Milliseconds 500 }
            if (Test-Path -LiteralPath $exe) { throw 'Program files remain after invalid-marker uninstall.' }
            if (-not (Test-Path -LiteralPath $data -PathType Container)) { throw 'Invalid data marker allowed user-data deletion.' }
            if (-not (Test-Path -LiteralPath $invalidLog -PathType Leaf) -or
                -not (Get-Content -LiteralPath $invalidLog -Raw).Contains('DATA preserved: marker validation failed')) {
              throw 'Invalid-marker refusal was not recorded.'
            }
            Write-Output 'Invalid data-marker purge refusal: PASS'
          } finally {
            if ($app -and -not $app.HasExited) { Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue }
            if (Test-Path -LiteralPath $shortcutPath) { Remove-Item -LiteralPath $shortcutPath -Force }
            if (Test-Path -LiteralPath $root) { Remove-Item -LiteralPath $root -Recurse -Force -ErrorAction SilentlyContinue }
          }

      - name: Attest verified primary release artifacts
        id: attest
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            .release/installer/*.exe
            .release/installer/*.zip
            .release/source.zip

      - name: Build SBOM and release evidence package
        shell: pwsh
        run: |
          $evidenceArguments = @(
            '--manifest', '.release/installer/BUILD-MANIFEST.json',
            '--build-identity', '.release/build-identity.json',
            '--source-archive', '.release/source.zip',
            '--test-results', '.release/prebuild-test-results.json',
            '--installer-dir', '.release/installer',
            '--output-dir', '.release/release-evidence',
            '--evidence', 'premium-previews=.release/premium-previews',
            '--evidence', 'visual-qa=.release/visual-qa',
            '--evidence', 'full-acceptance=.release/full-acceptance',
            '--evidence', 'native-safety=.release/native-safety'
          )
          $attestation = '${{ steps.attest.outputs.attestation-url }}'
          if ($attestation) { $evidenceArguments += @('--attestation-reference', $attestation) }
          python tools/release/build_release_evidence.py @evidenceArguments
          if ($LASTEXITCODE -ne 0) { throw 'Release evidence package generation failed.' }
          node tools/release/verify-build-manifest.mjs `
            --manifest .release/installer/BUILD-MANIFEST.json `
            --build-identity .release/build-identity.json `
            --source-archive .release/source.zip `
            --payload-dir .release/payload `
            --installer-dir .release/installer `
            --sbom .release/release-evidence/SBOM.spdx.json
          if ($LASTEXITCODE -ne 0) { throw 'Final BUILD-MANIFEST and SBOM verification failed.' }

      - name: Upload verified Windows evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: justfun-windows-${{ github.sha }}
          path: |
            .release/build-identity.json
            .release/source.zip
            .release/prebuild-test-results.json
            .release/update-helper-self-test.json
            .release/installer/
            .release/premium-previews/
            .release/visual-qa/
            .release/full-acceptance/
            .release/native-safety/
            .release/release-evidence/
          if-no-files-found: warn
          retention-days: 14
