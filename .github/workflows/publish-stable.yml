name: Publish stable update catalog

on:
  workflow_dispatch:
    inputs:
      catalog_path:
        description: Signed stable catalog tracked under release/catalogs
        required: true
        default: release/catalogs/stable.json
        type: string
      build_run_id:
        description: Successful exact-SHA Windows native release gate run ID
        required: true
        type: string

permissions:
  contents: write
  actions: read

jobs:
  publish:
    uses: ./.github/workflows/_publish-update-catalog.yml
    with:
      channel: stable
      catalog_path: ${{ inputs.catalog_path }}
      wrangler_environment: production
      protected_environment: update-production
      required_directive: release
      build_run_id: ${{ inputs.build_run_id }}
      production_kv_namespace_id: ${{ vars.CLOUDFLARE_UPDATE_CATALOG_PRODUCTION_KV_NAMESPACE_ID }}
      staging_kv_namespace_id: ${{ vars.CLOUDFLARE_UPDATE_CATALOG_STAGING_KV_NAMESPACE_ID }}
