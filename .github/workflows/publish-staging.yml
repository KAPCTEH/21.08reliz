name: Publish staging update catalog

on:
  workflow_dispatch:
    inputs:
      catalog_path:
        description: Signed staging catalog tracked under release/catalogs
        required: true
        default: release/catalogs/staging.json
        type: string
      build_run_id:
        description: Successful exact-SHA Windows native release gate run ID
        required: true
        type: string

permissions:
  contents: write
  actions: read

jobs:
  publish:
    uses: ./.github/workflows/_publish-update-catalog.yml
    with:
      channel: staging
      catalog_path: ${{ inputs.catalog_path }}
      wrangler_environment: staging
      protected_environment: update-staging
      required_directive: release
      build_run_id: ${{ inputs.build_run_id }}
      production_kv_namespace_id: ${{ vars.CLOUDFLARE_UPDATE_CATALOG_PRODUCTION_KV_NAMESPACE_ID }}
      staging_kv_namespace_id: ${{ vars.CLOUDFLARE_UPDATE_CATALOG_STAGING_KV_NAMESPACE_ID }}
