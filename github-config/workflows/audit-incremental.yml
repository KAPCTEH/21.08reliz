name: Audit incremental

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit-incremental-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  impact-and-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      JF_REQUIRE_POSTGRES_TESTS: "1"
      JF_TEST_POSTGRES_ADMIN_DSN: postgresql://justfun_ci_admin:justfun_ci_admin@127.0.0.1:5432/justfun_ci
      JF_TEST_POSTGRES_DSN: postgresql://justfun_ci_app:justfun_ci_app@127.0.0.1:5432/justfun_ci
    services:
      postgres:
        image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
        env:
          POSTGRES_DB: justfun_ci
          POSTGRES_USER: justfun_ci_admin
          POSTGRES_PASSWORD: justfun_ci_admin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U justfun_ci_admin -d justfun_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout exact target revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout orphan audit ledger
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: audit-ledger
          path: _audit-ledger
          fetch-depth: 1
          persist-credentials: false

      - name: Configure Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            tests/package-lock.json
            source/application/package-lock.json
            source/desktop-runtime/package-lock.json
            source/installer/package-lock.json
            source/license-server/package-lock.json
            source/company-telegram-broker/package-lock.json
            source/update-catalog-service/package-lock.json

      - name: Configure Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install pinned Python test dependencies
        shell: bash
        run: python -m pip install --disable-pip-version-check --no-deps Pillow==12.3.0 psycopg2-binary==2.9.12

      - name: Verify canonical release contract and test catalog
        run: node tools/release/verify-release-contract.mjs

      - name: Resolve exact diff range
        id: range
        shell: bash
        env:
          EVENT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          EVENT_TARGET: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          TARGET_REF: ${{ github.ref }}
        run: |
          target="$EVENT_TARGET"
          base="$EVENT_BASE"
          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then base="$(git rev-parse "$target^")"; fi
          if ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            git fetch --no-tags origin "$base" || true
          fi
          if ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            if [[ "$EVENT_NAME" == "push" && "$TARGET_REF" != "refs/heads/main" ]]; then
              git fetch --no-tags origin main
              base="$(git merge-base "$target" origin/main)"
            else
              base="$(git rev-parse "$target^")"
            fi
          fi
          git cat-file -e "$base^{commit}"
          git cat-file -e "$target^{commit}"
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "target=$target" >> "$GITHUB_OUTPUT"

      - name: Calculate impact and selected tests
        run: node tools/audit/impact.mjs _audit-ledger "${{ steps.range.outputs.base }}" "${{ steps.range.outputs.target }}" audit-impact.json

      - name: Verify permanent ledger
        run: node tools/audit/verify-ledger.mjs _audit-ledger . audit-ledger-verification.json

      - name: Install lockfile-pinned test dependencies
        shell: bash
        run: |
          for directory in tests source/application source/desktop-runtime source/installer source/license-server source/company-telegram-broker source/update-catalog-service; do
            npm ci --ignore-scripts --no-audit --no-fund --prefix "$directory"
          done

      - name: Build complete source UI inventory
        run: python tests/runtime-button-matrix.py source/application/web --edition full --list-only --report artifacts/ui-control-inventory-full.json

      - name: Run safe selected tests
        run: node tools/audit/run-selected-tests.mjs audit-impact.json selected-test-results.json

      - name: Upload incremental evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: audit-incremental-${{ github.run_id }}
          path: |
            audit-impact.json
            audit-ledger-verification.json
            selected-test-results.json
            artifacts/ui-control-inventory-full.json
          if-no-files-found: warn
          retention-days: 14
